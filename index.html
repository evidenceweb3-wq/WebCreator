<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebHub PRO · Constructor de webs</title>
<style>
:root{--bg:#090c11;--pn:#10151c;--ln:#212a36;--tx:#eef2f6;--mut:#8b96a5;--ac:#00ff88}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
.top{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--ln);background:var(--pn);flex-wrap:wrap}
.logo{font-weight:900;letter-spacing:1px;color:var(--ac);margin-right:2px}
.logo small{color:#021008;background:var(--ac);font-size:10px;padding:2px 6px;border-radius:6px;margin-left:5px;letter-spacing:1px}
.top select{background:#090c11;border:1px solid var(--ln);border-radius:8px;padding:8px;max-width:150px}
.b{background:#19202b;border:1px solid var(--ln);border-radius:8px;padding:8px 11px;cursor:pointer;font-size:14px;white-space:nowrap}
.b:active{transform:scale(.97)}
.b:disabled{opacity:.35;cursor:default}
.b.pri{background:var(--ac);color:#021008;border-color:var(--ac);font-weight:800}
.b.dng{color:#ff6b7a}
.b.on{border-color:var(--ac);color:var(--ac)}
.sp{flex:1}
.main{flex:1;display:grid;grid-template-columns:430px 1fr;min-height:0}
.pane-edit{display:flex;flex-direction:column;border-right:1px solid var(--ln);min-height:0;background:var(--pn)}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--ln);flex-shrink:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:12px 13px;color:var(--mut);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-size:14px}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
#panel{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:13px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
.f input,.f textarea,.f select{background:#090c11;border:1px solid var(--ln);border-radius:8px;padding:10px;color:var(--tx);width:100%}
.f textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.f input[type=color]{padding:2px;height:42px;cursor:pointer}
.f input[type=range]{padding:0;accent-color:var(--ac);height:28px}
.f .lb{display:flex;justify-content:space-between}
.f .v{color:var(--ac);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.h{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ac);margin-top:8px;padding-top:12px;border-top:1px solid var(--ln)}
.h:first-child{border:0;margin-top:0;padding-top:0}
.lay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lay button{background:#090c11;border:2px solid var(--ln);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.lay button.on{border-color:var(--ac)}
.lay b{display:block;margin-bottom:3px;font-size:15px}
.lay span{font-size:12px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:44px;height:44px;border-radius:50%;border:3px solid var(--ln);cursor:pointer;position:relative;overflow:hidden}
.chip i{position:absolute;inset:0}
.chip i+i{inset:auto 0 0 0;height:50%}
.tpl{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:flex;align-items:center;gap:10px;background:#090c11;border:1px solid var(--ln);border-radius:8px;padding:10px;font-size:14px;color:var(--tx);cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--ac)}
.ord{display:flex;gap:6px;align-items:stretch}
.prod{background:#090c11;border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.prod .ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumb{width:54px;height:54px;border-radius:8px;background:#19202b;object-fit:cover;flex-shrink:0;display:grid;place-items:center;font-size:11px;color:var(--mut)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal div{position:relative}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.gal button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:0;color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer}
.small{font-size:12px;color:var(--mut);line-height:1.4}
.pane-prev{display:flex;flex-direction:column;min-height:0;background:#05070a}
.pbar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--ln);align-items:center;flex-wrap:wrap}
.pwrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;overflow:auto;padding:12px 0}
#frame{border:6px solid #222;background:#fff;width:390px;max-width:100%;height:100%;border-radius:20px;transition:width .25s}
.pwrap.full{padding:0}
.pwrap.full #frame{border:0;border-radius:0;width:100%}
.mob{display:none}
@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .pane-prev{display:none}
  body.show-prev .pane-edit{display:none}
  body.show-prev .pane-prev{display:flex}
  .mob{display:inline-block}
  .top select{max-width:105px}
  #frame{width:100%;border-width:0;border-radius:0}
}

/* Supabase login + cloud status */
#authGate{position:fixed;inset:0;z-index:9999;background:rgba(5,8,12,.96);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#authGate.show{display:flex}
.authCard{width:min(100%,430px);background:#10151c;border:1px solid #263342;border-radius:18px;padding:26px;box-shadow:0 24px 90px #0009}
.authCard h2{font-size:24px;margin-bottom:8px;color:#00ff88}
.authCard p{font-size:13px;color:#9aa7b6;line-height:1.5;margin-bottom:18px}
.authField{display:flex;flex-direction:column;gap:6px;margin:12px 0;color:#aeb8c5;font-size:13px}
.authField input{width:100%;background:#090c11;border:1px solid #293443;border-radius:9px;padding:12px;color:#fff}
.authActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
#authMsg{font-size:13px;min-height:20px;margin-top:14px;color:#00ff88;overflow-wrap:anywhere}
#cloudStatus{font-size:11px;color:#9aa7b6;white-space:nowrap}
@media(max-width:600px){#cloudStatus{display:none}.authCard{padding:20px}}

</style>
</head>

<div class="top">

</div>

<div id="authGate" class="show">
  <div class="authCard">
    <h2>WEBHUB PRO</h2>
    <p>Ingresá con tu cuenta para guardar tu sitio en la nube y recuperarlo desde cualquier dispositivo.</p>
    <label class="authField">Email<input id="authEmail" type="email" autocomplete="email" placeholder="tu@email.com"></label>

    <div class="authActions">
      <button class="b pri" id="bLogin">Iniciar sesión</button>
      <button class="b" id="bSignup">Crear cuenta</button>
    </div>
    <div id="authMsg">Conectando con Supabase…</div>
  </div>
</div>

<div class="main">
  <div class="pane-edit">
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </div>
  <div class="pane-prev">
    <div class="pbar">
      <button class="b" data-dev="390">Móvil</button>
      <button class="b" data-dev="768">Tablet</button>
      <button class="b" data-dev="full">PC</button>
      <span class="sp"></span>
      <button class="b" id="bTab">Abrir en pestaña</button>
      <button class="b" id="bJson">Guardar proyecto</button>
      <button class="b" id="bOpen">Abrir proyecto</button>
      <button class="b" id="bBackup">Backup total</button>
      <input type="file" id="fileJson" accept=".json" hidden>
    </div>
    <div class="pwrap" id="pwrap"><iframe id="frame" title="preview" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe></div>
  </div>
</div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>

function merge(d,o){
  if(d===null||typeof d!=="object"||Array.isArray(d)) return o===undefined?d:o;
  const r={...d};
  for(const k in (o||{})){
    r[k]=(d[k]&&typeof d[k]==="object"&&!Array.isArray(d[k])&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))?merge(d[k],o[k]):o[k];
  }
  return r;
}
function normalize(o){
  const s=merge(newSite(),o||{});
  ORDER.forEach(k=>{if(!s.order.includes(k))s.order.push(k);});
  s.order=s.order.filter(k=>ORDER.includes(k));
  if(!FONTS[s.font])s.font="moderna";
  if(!LAYOUTS[s.layout])s.layout="catalogo";
  return s;
}

/* ================= GENERADOR DE LA WEB ================= */
const esc = t => String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function ink(hex){const n=parseInt(String(hex).slice(1),16)||0,r=n>>16&255,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>150?"#0b0b0b":"#ffffff";}

function buildSite(s){
  const e=esc,c=s.colors,f=FONTS[s.font],[R,BR]=RADIUS[s.radius]||RADIUS.suave;
  const nl=t=>e(t).replace(/\n/g,"<br>");
  const num=(s.wa||"").replace(/\D/g,"");
  const wa=m=>"https://wa.me/"+num+(m?"?text="+encodeURIComponent(m):"");
  const waMain=wa("Hola! Vi la página de "+s.name+" y quiero consultar.");
  const PAD={compacto:44,normal:64,amplio:100}[s.spacing]||64;
  const CW={angosto:900,normal:1080,ancho:1280}[s.width]||1080;
  const upc=(f.up||s.upper)?"text-transform:uppercase;":"";
  const acf=s.grad?`linear-gradient(135deg,${c.ac},${c.ac2})`:c.ac;
  const cardCss={border:"border:1px solid var(--ln)",flat:"border:0",shadow:"border:0;box-shadow:0 14px 34px rgba(0,0,0,.2)",glass:"border:1px solid var(--ln);background:color-mix(in srgb,var(--cd) 55%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)"}[s.cardStyle]||"";
  const btnCss={solid:"background:var(--acf);color:var(--ink);border:2px solid transparent",outline:"background:transparent;color:var(--ac);border:2px solid var(--ac)",soft:"background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);border:2px solid transparent"}[s.btnStyle]||"";
  const oa=Math.min(Math.max(+s.overlay||0,0),90)/100;
  const hh={medio:"62vh",alto:"82vh",pantalla:"100vh"}[s.heroH]||"62vh";
  const al=s.heroAlign==="left"?"left":"center";
  const bio=s.layout==="bio";

  const css=`:root{--bg:${c.bg};--tx:${c.tx};--ac:${c.ac};--ac2:${c.ac2};--acf:${acf};--cd:${c.card};--ink:${ink(c.ac)};--r:${R};--br:${BR};--mu:color-mix(in srgb,var(--tx) 62%,transparent);--ln:color-mix(in srgb,var(--tx) 14%,transparent)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:${f.b};line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.ht{font-family:${f.h};font-weight:${f.w};${upc}letter-spacing:${(+s.ls||0)/100}em;line-height:1.05}
h1,h2{zoom:${(+s.headScale||100)/100}}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.btn{display:inline-block;${btnCss};font-weight:800;padding:14px 26px;border-radius:var(--br);font-size:15px;cursor:pointer;text-align:center}
.btn.gh{background:transparent;color:inherit;border:2px solid currentColor}
.btn.sm{padding:9px 18px;font-size:14px}
.wrap{max-width:${CW}px;margin:0 auto;padding:0 20px}
.bio .wrap{max-width:520px}
section{padding:${PAD}px 0}
.card{background:var(--cd);border-radius:var(--r);overflow:hidden;${cardCss}}
.pr{color:var(--ac);font-weight:800}.mu{color:var(--mu)}
.sec-t{font-size:clamp(30px,5.5vw,46px);margin-bottom:26px}
.kick{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--ac);font-weight:800;margin-bottom:14px}
.nav{display:flex;gap:22px;font-size:14px;font-weight:600}.nav a{opacity:.8}.nav a:hover{opacity:1}
@media(max-width:760px){.nav{display:none}}
.fab{position:fixed;${s.fab.pos==="left"?"left":"right"}:14px;bottom:14px;background:#25d366;color:#04230f;font-weight:800;padding:13px 20px;border-radius:var(--br);box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:50;font-size:14px}
details summary::-webkit-details-marker{display:none}
.lk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-radius:var(--br);border:2px solid var(--ac);background:var(--cd);font-weight:700;margin-bottom:12px;text-align:left}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
footer{padding:30px 0;text-align:center;font-size:13px}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}`;

  const brand=`<a href="#" style="display:flex;align-items:center;gap:10px">${s.logo?`<img src="${s.logo}" alt="" style="height:38px;width:auto">`:""}<span class="ht" style="font-size:21px">${e(s.name)}</span></a>`;
  const LBL={prod:s.prodT,about:s.aboutT,gal:s.galT,test:"Opiniones",faq:"FAQ",cont:s.contT};
  const navItems=["prod","about","gal","test","faq","cont"].filter(k=>s.sections[k]).map(k=>`<a href="#${ANCH[k]}">${e(LBL[k]||k)}</a>`).join("");
  const nav=s.navLinks&&navItems?`<nav class="nav">${navItems}</nav>`:"";
  const header=inHero=>`<header style="${inHero?"position:relative;z-index:2;":(s.stickyHeader?"position:sticky;top:0;z-index:40;":"")+"background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);"}"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px">${brand}${nav}<a class="btn sm" href="${waMain}" target="_blank" rel="noopener">Escribinos</a></div></header>`;

  const heroBg=s.hero?`background:linear-gradient(rgba(0,0,0,${(oa*.75).toFixed(2)}),rgba(0,0,0,${oa.toFixed(2)})),url('${s.hero}') center/cover;color:#fff;`:`background:linear-gradient(160deg,var(--cd),var(--bg));`;
  const heroInner=`${s.kicker?`<div class="kick">${e(s.kicker)}</div>`:""}<h1 style="font-size:clamp(40px,8.5vw,84px)">${e(s.name)}</h1><p style="font-size:clamp(17px,2.4vw,22px);margin:18px 0 30px;opacity:.88;max-width:600px;${al==="center"?"margin-left:auto;margin-right:auto;":""}">${e(s.tagline)}</p><div style="display:flex;gap:12px;flex-wrap:wrap;${al==="center"?"justify-content:center":""}"><a class="btn" href="${waMain}" target="_blank" rel="noopener">${e(s.cta)}</a>${s.sections.prod?`<a class="btn gh" href="#productos">Ver más</a>`:""}</div>`;
  const heroBox=`<div style="max-width:820px;margin:0 ${al==="center"?"auto":"0"}">${heroInner}</div>`;
  const heroBanner=s.hero?`<div class="wrap"><img src="${s.hero}" alt="" style="width:100%;height:clamp(180px,34vw,400px);object-fit:cover;border-radius:var(--r)"></div>`:"";

  const igUrl=s.ig?"https://instagram.com/"+s.ig.replace(/^@/,""):"";
  const mpBtn=s.mp?`<a class="btn gh" href="${e(s.mp)}" target="_blank" rel="noopener">Pagar con Mercado Pago</a>`:"";
  const P=s.productos;
  const pbtn=p=>{const href=p.link||wa("Hola! Quiero consultar por: "+p.n);return `<a class="btn sm" href="${e(href)}" target="_blank" rel="noopener">${p.link?"Comprar":"Consultar"}</a>`;};
  const badge=p=>p.badge?`<span style="position:absolute;top:10px;left:10px;background:var(--acf);color:var(--ink);font-size:12px;font-weight:800;padding:4px 10px;border-radius:var(--br)">${e(p.badge)}</span>`:"";
  const priceH=p=>`<span class="pr">${p.old?`<s class="mu" style="font-weight:400;font-size:.8em;margin-right:6px">${e(p.old)}</s>`:""}${e(p.p)}</span>`;
  const imgBox=(p,ratio)=>`<div style="position:relative">${p.img?`<img src="${p.img}" alt="${e(p.n)}" style="width:100%;aspect-ratio:${ratio};object-fit:cover">`:`<div style="aspect-ratio:${ratio};display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--cd));font-size:60px;font-weight:900;color:var(--ink)">${e((p.n||"?")[0])}</div>`}${badge(p)}</div>`;
  const prodCard=p=>`<div class="card">${imgBox(p,"1")}<div style="padding:16px"><h3 style="font-size:20px">${e(p.n)}</h3><p class="mu" style="font-size:14px;margin:6px 0 12px">${e(p.d)}</p><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">${priceH(p)}${pbtn(p)}</div></div></div>`;
  const sec=(id,title,inner,style="")=>`<section id="${id}" style="${style}"><div class="wrap">${title?`<h2 class="sec-t">${e(title)}</h2>`:""}${inner}</div></section>`;

  const SM={
    pts:()=>{const pt=s.points.filter(Boolean);return pt.length?`<section id="beneficios" style="padding:${Math.round(PAD*.7)}px 0"><div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">${pt.map((t,i)=>`<div class="card" style="padding:24px"><div class="pr ht" style="font-size:34px">0${i+1}</div><h3 style="font-size:21px;margin-top:8px">${e(t)}</h3></div>`).join("")}</div></section>`:"";},
    prod:()=>{
      if(!P.length)return "";
      if(s.layout==="landing")return `<section id="productos"><div class="wrap"><h2 class="sec-t">${e(s.prodT)}</h2></div><div style="display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 18px">${P.map(p=>`<div style="min-width:min(270px,78vw);scroll-snap-align:start;flex-shrink:0;display:flex">${prodCard(p).replace('class="card"','class="card" style="width:100%"')}</div>`).join("")}</div></section>`;
      if(s.layout==="editorial")return sec("productos",s.prodT,P.map((p,i)=>`<div style="display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:20px 0;border-top:1px solid var(--ln)"><span class="pr ht" style="font-size:20px">${String(i+1).padStart(2,"0")}</span><div style="display:flex;gap:14px;align-items:center">${p.img?`<img src="${p.img}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:var(--r)">`:""}<div><h3 style="font-size:24px">${e(p.n)}${p.badge?` <small class="pr" style="font-size:12px;font-family:system-ui">${e(p.badge)}</small>`:""}</h3><p class="mu" style="font-size:14px">${e(p.d)}</p></div></div><div style="text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end">${priceH(p)}${pbtn(p)}</div></div>`).join(""));
      if(s.layout==="carta")return sec("productos",s.prodT,`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 56px">${P.map(p=>`<div style="padding:14px 0;border-bottom:1px dashed var(--ln)"><div style="display:flex;align-items:baseline;gap:10px"><h3 style="font-size:21px">${e(p.n)}${p.badge?` <small class="pr" style="font-size:12px;font-family:system-ui">${e(p.badge)}</small>`:""}</h3><span style="flex:1;border-bottom:2px dotted var(--ln);transform:translateY(-4px)"></span>${priceH(p)}</div><p class="mu" style="font-size:14px;margin-top:4px">${e(p.d)}</p>${p.link?`<a class="pr" style="font-size:13px" href="${e(p.link)}" target="_blank" rel="noopener">Comprar →</a>`:""}</div>`).join("")}</div>`);
      if(s.layout==="portfolio")return sec("productos",s.prodT,`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">${P.map(p=>`<a class="card" style="display:block;position:relative" href="${e(p.link||wa("Hola! Quiero consultar por: "+p.n))}" target="_blank" rel="noopener">${imgBox(p,"4/5")}<div style="position:absolute;left:0;right:0;bottom:0;padding:48px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff"><h3 style="font-size:22px">${e(p.n)}</h3><div style="display:flex;justify-content:space-between;gap:10px;font-size:14px;opacity:.9"><span>${e(p.d)}</span><b>${e(p.p)}</b></div></div></a>`).join("")}</div>`);
      return sec("productos",s.prodT,`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px">${P.map(prodCard).join("")}</div>`);
    },
    about:()=>{
      if(s.layout==="landing")return `<section id="nosotros"><div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:34px;align-items:center"><div style="aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--acf);display:grid;place-items:center">${s.logo?`<img src="${s.logo}" alt="" style="width:60%;height:auto">`:`<span class="ht" style="font-size:120px;color:var(--ink)">${e((s.name||"?")[0])}</span>`}</div><div><h2 class="sec-t">${e(s.aboutT)}</h2><p class="mu" style="font-size:18px">${nl(s.about)}</p></div></div></section>`;
      if(s.layout==="editorial")return `<section id="nosotros" style="background:var(--cd)"><div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:30px"><h2 class="sec-t" style="margin:0">${e(s.aboutT)}</h2><p style="font-size:clamp(20px,3vw,28px);line-height:1.4">${nl(s.about)}</p></div></section>`;
      return `<section id="nosotros"><div class="wrap" style="max-width:${bio?520:780}px"><h2 class="sec-t">${e(s.aboutT)}</h2><p style="font-size:18px" class="mu">${nl(s.about)}</p></div></section>`;
    },
    gal:()=>s.gallery.length?sec("galeria",s.galT,`<div style="columns:3 200px;column-gap:12px">${s.gallery.map(g=>`<img class="rvx" src="${g}" alt="" style="width:100%;border-radius:var(--r);margin-bottom:12px;break-inside:avoid">`).join("")}</div>`):"",
    test:()=>s.testimonials.length?sec("opiniones",s.testT,`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px">${s.testimonials.map(t=>`<div class="card" style="padding:24px"><div class="pr ht" style="font-size:44px;line-height:.6">“</div><p style="margin:12px 0 16px">${e(t.t)}</p><b>${e(t.n)}</b></div>`).join("")}</div>`):"",
    faq:()=>s.faq.length?sec("faq",s.faqT,`<div style="max-width:760px">${s.faq.map(q=>`<details class="card" style="padding:16px 20px;margin-bottom:10px"><summary style="cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px">${e(q.q)}<span class="pr">+</span></summary><p class="mu" style="margin-top:10px">${nl(q.a)}</p></details>`).join("")}</div>`):"",
    map:()=>s.dir?sec("mapa","",`<iframe title="mapa" loading="lazy" src="https://www.google.com/maps?q=${encodeURIComponent(s.dir)}&output=embed" style="width:100%;height:340px;border:0;border-radius:var(--r)"></iframe>`,`padding:${Math.round(PAD*.5)}px 0`):"",
    cta:()=>`<section id="cta" style="background:var(--acf);color:var(--ink);text-align:center"><div class="wrap"><h2 style="font-size:clamp(28px,5vw,44px);margin-bottom:22px">${e(s.ctaT||s.tagline)}</h2><a class="btn" style="background:var(--ink);color:var(--ac);border:2px solid var(--ink)" href="${waMain}" target="_blank" rel="noopener">${e(s.cta)}</a></div></section>`,
    cont:()=>{
      const info=[["Dirección",s.dir],["Horarios",s.horarios],["Teléfono",s.tel]].filter(x=>x[1]).map(x=>`<div class="card" style="padding:20px"><div class="mu" style="font-size:12px;text-transform:uppercase;letter-spacing:2px">${x[0]}</div><div style="margin-top:6px;font-weight:600">${x[0]==="Teléfono"?`<a href="tel:${e(s.tel.replace(/[^\d+]/g,""))}">${e(x[1])}</a>`:nl(x[1])}</div></div>`).join("");
      const soc=[[igUrl,"Instagram"],[s.fb,"Facebook"],[s.tt,"TikTok"],[s.yt,"YouTube"]].filter(x=>x[0]).map(x=>`<a class="btn gh" href="${e(x[0])}" target="_blank" rel="noopener">${x[1]}</a>`).join("");
      return sec("contacto",s.contT,`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">${info}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px"><a class="btn" href="${waMain}" target="_blank" rel="noopener">${e(s.cta)}</a>${soc}${s.mail?`<a class="btn gh" href="mailto:${e(s.mail)}">Email</a>`:""}${mpBtn}</div>`);
    }
  };

  let top="";
  if(s.layout==="catalogo"){
    top=header(false)+`<div style="${heroBg}min-height:${hh};display:flex;align-items:center;text-align:${al}"><div class="wrap" style="width:100%;padding-top:50px;padding-bottom:50px">${heroBox}</div></div>`;
  } else if(s.layout==="landing"){
    top=`<div style="${heroBg}min-height:${hh};display:flex;flex-direction:column;text-align:${al}">${header(true)}<div class="wrap" style="flex:1;display:flex;align-items:center;width:100%"><div style="width:100%;padding:30px 0 70px">${heroBox}</div></div></div>`;
  } else if(s.layout==="editorial"){
    const tk=Array(8).fill(e(s.tagline)).join(" &nbsp;✦&nbsp; ");
    top=header(false)+`<div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;padding-top:34px;padding-bottom:54px;align-items:center"><div>${s.kicker?`<div class="kick">${e(s.kicker)}</div>`:""}<h1 style="font-size:clamp(52px,12vw,130px);word-break:break-word">${e(s.name)}</h1><p style="font-size:20px;margin:22px 0 28px;max-width:420px" class="mu">${e(s.tagline)}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="${waMain}" target="_blank" rel="noopener">${e(s.cta)}</a>${mpBtn}</div></div><div style="aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--acf);display:grid;place-items:center">${s.hero?`<img src="${s.hero}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<span class="ht" style="font-size:180px;color:var(--ink)">${e((s.name||"?")[0])}</span>`}</div></div><div style="border-block:2px solid var(--tx);overflow:hidden;padding:14px 0;white-space:nowrap"><div style="display:inline-block;animation:mq 32s linear infinite;font-family:${f.h};font-size:22px;font-weight:${f.w};text-transform:uppercase">${tk} &nbsp;✦&nbsp; ${tk}</div></div>`;
  } else if(s.layout==="carta"){
    top=`<header style="text-align:center;padding:38px 20px 26px">${s.logo?`<img src="${s.logo}" alt="" style="height:64px;margin:0 auto 12px">`:""}<div class="kick">${e(s.kicker||"Carta")}</div><h1 style="font-size:clamp(44px,9vw,92px)">${e(s.name)}</h1><p class="mu" style="margin:14px auto 0;max-width:520px;font-size:18px">${e(s.tagline)}</p><div class="pr" style="margin:20px 0 6px;letter-spacing:12px">✦ ✦ ✦</div>${nav?`<div style="display:flex;justify-content:center;margin-top:10px">${nav}</div>`:""}<div style="margin-top:22px"><a class="btn" href="${waMain}" target="_blank" rel="noopener">${e(s.cta)}</a></div></header>${heroBanner}`;
  } else if(s.layout==="portfolio"){
    top=header(false)+`<div class="wrap" style="padding-top:70px;padding-bottom:34px">${s.kicker?`<div class="kick">${e(s.kicker)}</div>`:""}<h1 style="font-size:clamp(48px,11vw,128px);word-break:break-word">${e(s.name)}</h1><p class="mu" style="font-size:clamp(18px,2.6vw,24px);margin:20px 0 28px;max-width:560px">${e(s.tagline)}</p><a class="btn" href="${waMain}" target="_blank" rel="noopener">${e(s.cta)}</a></div>${heroBanner}`;
  } else {
    top=`<div class="wrap" style="padding-top:44px;padding-bottom:10px;text-align:center"><div style="width:104px;height:104px;border-radius:50%;margin:0 auto 16px;border:3px solid var(--ac);overflow:hidden;display:grid;place-items:center;background:var(--cd);font-size:42px;font-weight:900;color:var(--ac)">${s.logo?`<img src="${s.logo}" alt="" style="width:100%;height:100%;object-fit:cover">`:e((s.name||"?")[0])}</div>${s.kicker?`<div class="kick">${e(s.kicker)}</div>`:""}<h1 style="font-size:32px">${e(s.name)}</h1><p class="mu" style="margin:8px 0 26px">${e(s.tagline)}</p><div>${num?`<a class="lk" href="${waMain}" target="_blank" rel="noopener"><span>${e(s.cta)}</span><span class="pr">WhatsApp</span></a>`:""}${s.sections.prod?`<div class="mu" style="font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:22px 0 12px">${e(s.prodT)}</div>${P.map(p=>`<a class="lk" href="${e(p.link||wa("Hola! Quiero consultar por: "+p.n))}" target="_blank" rel="noopener"><span>${e(p.n)}${p.badge?` <small class="pr">${e(p.badge)}</small>`:""}${p.d?`<br><small class="mu" style="font-weight:400">${e(p.d)}</small>`:""}</span>${priceH(p)}</a>`).join("")}`:""}${s.mp?`<a class="lk" href="${e(s.mp)}" target="_blank" rel="noopener"><span>Pagar con Mercado Pago</span><span class="pr">→</span></a>`:""}${igUrl?`<a class="lk" href="${e(igUrl)}" target="_blank" rel="noopener"><span>Instagram</span><span class="pr">@${e(s.ig.replace(/^@/,""))}</span></a>`:""}${s.fb?`<a class="lk" href="${e(s.fb)}" target="_blank" rel="noopener"><span>Facebook</span><span class="pr">→</span></a>`:""}${s.tt?`<a class="lk" href="${e(s.tt)}" target="_blank" rel="noopener"><span>TikTok</span><span class="pr">→</span></a>`:""}${s.yt?`<a class="lk" href="${e(s.yt)}" target="_blank" rel="noopener"><span>YouTube</span><span class="pr">→</span></a>`:""}${s.mail?`<a class="lk" href="mailto:${e(s.mail)}"><span>Email</span><span class="pr">→</span></a>`:""}</div></div>`;
  }

  const skip=bio?["prod","cta","pts"]:[];
  const mid=s.order.filter(k=>s.sections[k]&&!skip.includes(k)&&!(bio&&k==="cont"&&false)).map(k=>SM[k]()).join("");
  const ann=s.announce.on&&s.announce.text?`<div style="background:var(--acf);color:var(--ink);text-align:center;padding:9px 16px;font-weight:700;font-size:14px">${s.announce.link?`<a href="${e(s.announce.link)}" target="_blank" rel="noopener">${e(s.announce.text)}</a>`:e(s.announce.text)}</div>`:"";

function setCloudStatus(message,isError=false){

async function uploadCloudImage(dataUrl,objectPath){
  if(typeof dataUrl!=="string"||!dataUrl.startsWith("data:image/"))return dataUrl;
  const response=await fetch(dataUrl);
  const blob=await response.blob();
  const ext=blob.type.includes("png")?"png":blob.type.includes("webp")?"webp":"jpg";
  const path=objectPath+"."+ext;
  const {error}=await supabaseClient.storage.from("wb-store-assets").upload(path,blob,{upsert:true,contentType:blob.type||"image/jpeg",cacheControl:"3600"});
  if(error)throw error;
  return supabaseClient.storage.from("wb-store-assets").getPublicUrl(path).data.publicUrl;
}
async function prepareCloudConfig(config){
  const copy=JSON.parse(JSON.stringify(config));
  if(copy.logo)copy.logo=await uploadCloudImage(copy.logo,cloudStoreId+"/logo/main");

  if(Array.isArray(copy.productos)){
    for(let i=0;i<copy.productos.length;i++)if(copy.productos[i]?.img)copy.productos[i].img=await uploadCloudImage(copy.productos[i].img,cloudStoreId+"/products/product-"+i);

  if(Array.isArray(copy.gallery)){
    for(let i=0;i<copy.gallery.length;i++)if(copy.gallery[i])copy.gallery[i]=await uploadCloudImage(copy.gallery[i],cloudStoreId+"/gallery/image-"+i);
  }
  return copy;
}
async function saveCloudConfig(){
  if(!cloudReady||!supabaseClient||!cloudStoreId||!cloudUser||cloudBusy)return;
  const current=S();if(!current)return;
  cloudBusy=true;setCloudStatus("Guardando…");
  let snapshot;
  try{snapshot=await prepareCloudConfig(JSON.parse(JSON.stringify(current)));}
  catch(uploadError){cloudBusy=false;setCloudStatus("Error al subir imágenes",true);console.error("WebHub image upload:",uploadError);return;}
  const {error}=await supabaseClient.from("wb_site_configs").upsert({

  cloudBusy=false;
  if(error){setCloudStatus("Error al guardar",true);console.error("WebHub cloud save:",error);return;}
  setCloudStatus("Guardado en la nube");

  if(JSON.stringify(S())!==JSON.stringify(snapshot))scheduleCloudSave();
}
async function loadOrCreateCloudStore(user){
  setCloudStatus("Cargando tienda…");
  const {data:members,error:memberError}=await supabaseClient.from("wb_store_members").select("store_id").eq("user_id",user.id);
  if(memberError)throw memberError;
  let store=null;
  if(members?.length){
    const ids=members.map(x=>x.store_id);
    const {data:stores,error:storeError}=await supabaseClient.from("wb_stores").select("id,name,slug,status").in("id",ids).order("created_at",{ascending:true});
    if(storeError)throw storeError;
    store=stores?.[0]||null;
  }
  if(!store){
    const base=(S()?.name||"Mi negocio").trim();
    const safeSlug=base.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,42)||"mi-negocio";
    const uniqueSlug=safeSlug+"-"+Math.random().toString(36).slice(2,7);
    const {data:newId,error:createError}=await supabaseClient.rpc("wb_create_store",{p_name:base,p_slug:uniqueSlug});
    if(createError)throw createError;
    store={id:newId,name:base,slug:uniqueSlug,status:"draft"};
  }
  cloudStoreId=store.id;
  const {data:cfg,error:configError}=await supabaseClient.from("wb_site_configs").select("config,version").eq("store_id",store.id).maybeSingle();
  if(configError)throw configError;
  const remote=cfg?.config;
  if(remote&&typeof remote==="object"&&!Array.isArray(remote)&&Object.keys(remote).length){
    DB.list[store.id]=normalize(remote);
  }else{
    // First cloud save: migrate the current local editor project without deleting local backups.
    DB.list[store.id]=normalize(S());
  }
  DB.cur=store.id;
  cloudReady=true;
  renderProj();renderPanel();renderPrev();
  if(!remote||!Object.keys(remote||{}).length)await saveCloudConfig();
  else setCloudStatus("Conectado · "+store.name);
  return store;
}
async function finishCloudLogin(session){
  if(!session?.user)return;
  const userId=session.user.id;
  if(cloudReady&&cloudUser?.id===userId)return;
  if(cloudLoadingUserId===userId)return;
  cloudLoadingUserId=userId;
  cloudUser=session.user;
  document.getElementById("bSignOut").style.display="inline-block";
  showAuth(false);
  try{await loadOrCreateCloudStore(session.user);}
  catch(err){cloudReady=false;showAuth(true);setAuthMessage("No se pudo cargar la tienda: "+(err.message||err),true);setCloudStatus("Error de conexión",true);}
  finally{cloudLoadingUserId=null;}
}
async function initCloudAuth(){
  if(!window.supabase?.createClient){setAuthMessage("No se pudo cargar la librería de Supabase. Revisá tu conexión a internet.",true);return;}
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data,error}=await supabaseClient.auth.getSession();
  if(error){setAuthMessage(error.message,true);return;}
  if(data.session)await finishCloudLogin(data.session);
  else{showAuth(true);setAuthMessage("Iniciá sesión o creá tu cuenta para continuar.");setCloudStatus("Sin iniciar sesión");}
  supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==="SIGNED_IN"&&session){setTimeout(()=>finishCloudLogin(session),0);}
    if(event==="SIGNED_OUT"){cloudReady=false;cloudUser=null;cloudStoreId=null;document.getElementById("bSignOut").style.display="none";showAuth(true);setCloudStatus("Sesión cerrada");setAuthMessage("Iniciá sesión o creá tu cuenta para continuar.");}
  });
}
async function authAction(mode){
  if(!supabaseClient){setAuthMessage("Supabase todavía está cargando.",true);return;}
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  if(!email||!password){setAuthMessage("Ingresá email y contraseña.",true);return;}
  if(password.length<6){setAuthMessage("La contraseña debe tener al menos 6 caracteres.",true);return;}
  setAuthMessage(mode==="signup"?"Creando cuenta…":"Iniciando sesión…");
  const result=mode==="signup"
    ?await supabaseClient.auth.signUp({email,password})
    :await supabaseClient.auth.signInWithPassword({email,password});
  if(result.error){setAuthMessage(result.error.message,true);return;}
  if(mode==="signup"&&!result.data.session){setAuthMessage("Cuenta creada. Revisá tu email y confirmá la dirección; después volvé e iniciá sesión.");return;}
  if(result.data.session)await finishCloudLogin(result.data.session);
}

function histGo(d){const n=H.i+d;if(n<0||n>=H.a.length)return;H.i=n;DB.list[DB.cur]=normalize(JSON.parse(H.a[n]));saveDB();renderProj();renderPanel();renderPrev();updUndo();}
function commit(form){saveDB();renderProj();renderPrev();if(form)renderPanel();clearTimeout(htm);htm=setTimeout(histSnap,500);}

function setPath(o,path,v){const ks=path.split(".");let t=o;for(let i=0;i<ks.length-1;i++)t=t[ks[i]];t[ks[ks.length-1]]=v;}

function fileToData(file,max,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement("canvas");
    cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    cb(file.type==="image/png"&&max<=400?cv.toDataURL("image/png"):cv.toDataURL("image/jpeg",.8));
  };im.src=fr.result;};fr.readAsDataURL(file);
}

function applyLayoutDefaults(s,l){const d=LAYOUT_DEF[l]||{};if(d.heroAlign)s.heroAlign=d.heroAlign;if(d.heroH)s.heroH=d.heroH;Object.assign(s.sections,d.sections||{});}
const NEW_ITEM={productos:()=>({n:"Nuevo producto",p:"$0",old:"",badge:"",d:"",img:"",link:""}),testimonials:()=>({n:"Nombre",t:"Escribí acá la opinión del cliente."}),faq:()=>({q:"Nueva pregunta",a:"Respuesta."})};

document.addEventListener("input",ev=>{
  const el=ev.target,s=S();if(!s)return;
  if(el.dataset.k){
    const v=el.type==="checkbox"?el.checked:el.type==="range"?+el.value:el.value;
    setPath(s,el.dataset.k,v);
    if(el.type==="range"){const sp=el.closest("label").querySelector(".v");if(sp)sp.textContent=v+(el.dataset.u||"");}
    commit(false);
  } else if(el.dataset.a){s[el.dataset.a][+el.dataset.i][el.dataset.f]=el.value;commit(false);}
});

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-tab],[data-layout],[data-preset],[data-tpl],[data-add],[data-rm],[data-mv],[data-mvs],[data-up],[data-upgal],[data-clr],[data-galrm],[data-reset],[data-dev]");
  if(!t||t.disabled)return;const s=S(),d=t.dataset;
  if(d.tab){tab=d.tab;renderTabs();renderPanel();}
  else if(d.layout){s.layout=d.layout;applyLayoutDefaults(s,d.layout);commit(true);}
  else if(d.preset){s.colors={...PRESETS[d.preset]};commit(true);}
  else if(d.tpl){
    if(!confirm("Se reemplazan estructura, estilo, textos y productos por el ejemplo de este rubro. ¿Seguir?"))return;
    const tp=JSON.parse(JSON.stringify(TEMPLATES[d.tpl]));delete tp.n;
    const sec=tp.sections||{};delete tp.sections;
    Object.assign(s,tp);s.colors={...tp.colors};applyLayoutDefaults(s,tp.layout);
    if(tp.heroAlign)s.heroAlign=tp.heroAlign;if(tp.heroH)s.heroH=tp.heroH;
    if(tp.grad===undefined)s.grad=false;
    Object.assign(s.sections,sec);commit(true);
  }
  else if(d.add){s[d.add].push(NEW_ITEM[d.add]());commit(true);}
  else if(d.rm){const[a,i]=d.rm.split(":");s[a].splice(+i,1);commit(true);}
  else if(d.mv){const[a,i,dir]=d.mv.split(":"),x=+i,y=x+(+dir);if(y<0||y>=s[a].length)return;[s[a][x],s[a][y]]=[s[a][y],s[a][x]];commit(true);}
  else if(d.mvs){const[i,dir]=d.mvs.split(":"),x=+i,y=x+(+dir);if(y<0||y>=s.order.length)return;[s.order[x],s.order[y]]=[s.order[y],s.order[x]];commit(true);}
  else if(d.up){imgTarget=d.up;$("fileImg").value="";$("fileImg").click();}
  else if(d.upgal){$("fileGal").value="";$("fileGal").click();}
  else if(d.clr){if(d.clr.startsWith("p:"))s.productos[+d.clr.slice(2)].img="";else s[d.clr]="";commit(true);}
  else if(d.galrm!==undefined){s.gallery.splice(+d.galrm,1);commit(true);}
  else if(d.reset){if(!confirm("¿Restablecer \""+s.name+"\" a los valores de fábrica? Se pierden sus datos."))return;DB.list[DB.cur]=newSite(s.name);commit(true);}
  else if(d.dev){setDev(d.dev);}
});

$("fileImg").addEventListener("change",ev=>{
  const f=ev.target.files[0];if(!f||!imgTarget)return;const s=S(),tg=imgTarget;
  fileToData(f,tg==="hero"?1400:tg==="logo"?360:720,data=>{if(tg.startsWith("p:"))s.productos[+tg.slice(2)].img=data;else s[tg]=data;commit(true);});
});
$("fileGal").addEventListener("change",ev=>{
  const fs=[...ev.target.files];if(!fs.length)return;const s=S();let n=0;
  fs.forEach(f=>fileToData(f,900,d=>{s.gallery.push(d);if(++n===fs.length){s.sections.gal=true;commit(true);}}));
});

/* proyectos */
$("projSel").onchange=e=>{DB.cur=e.target.value;saveDB();histInit();renderPanel();renderPrev();};
$("bNew").onclick=()=>{const n=prompt("Nombre del cliente/negocio:","Cliente "+(Object.keys(DB.list).length+1));if(!n)return;const id=uid();DB.list[id]=newSite(n);DB.cur=id;saveDB();histInit();renderProj();renderPanel();renderPrev();};
$("bDup").onclick=()=>{const id=uid(),c=JSON.parse(JSON.stringify(S()));c.name+=" (copia)";DB.list[id]=c;DB.cur=id;saveDB();histInit();renderProj();renderPanel();renderPrev();};
$("bDel").onclick=()=>{if(!confirm("¿Borrar \""+S().name+"\"?"))return;delete DB.list[DB.cur];loadDB();saveDB();histInit();renderProj();renderPanel();renderPrev();};
$("bUndo").onclick=()=>histGo(-1);
$("bRedo").onclick=()=>histGo(1);
document.addEventListener("keydown",ev=>{
  if(!(ev.ctrlKey||ev.metaKey))return;const k=ev.key.toLowerCase();
  if(ev.target.matches&&ev.target.matches("input[type=text],input:not([type]),textarea"))return;
  if(k==="z"&&!ev.shiftKey){ev.preventDefault();histGo(-1);}else if(k==="y"||(k==="z"&&ev.shiftKey)){ev.preventDefault();histGo(1);}
});

/* exportar / importar */
const slug=t=>(t||"web").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"web";
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
$("bExport").onclick=()=>download(slug(S().name)+".html",buildSite(S()),"text/html");
$("bTab").onclick=()=>{const u=URL.createObjectURL(new Blob([buildSite(S())],{type:"text/html"}));window.open(u,"_blank");};
$("bJson").onclick=()=>download(slug(S().name)+".webhub.json",JSON.stringify(S()),"application/json");
$("bBackup").onclick=()=>download("webhub-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(DB),"application/json");
$("bOpen").onclick=()=>$("fileJson").click();
$("fileJson").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
  try{const o=JSON.parse(r.result);
    if(o&&o.list){for(const k in o.list){const id=uid();DB.list[id]=normalize(o.list[k]);DB.cur=id;}}
    else{const id=uid();DB.list[id]=normalize(o);DB.cur=id;}
    saveDB();histInit();renderProj();renderPanel();renderPrev();
  }catch(x){alert("Archivo inválido");}};r.readAsText(f);};

/* vista */
function setDev(v){const w=$("pwrap"),fr=$("frame");if(v==="full"){w.classList.add("full");fr.style.width="";}else{w.classList.remove("full");fr.style.width=v+"px";}
  document.querySelectorAll("[data-dev]").forEach(b=>b.classList.toggle("on",b.dataset.dev===v));}
$("bView").onclick=()=>document.body.classList.toggle("show-prev");

loadDB();histInit();renderTabs();renderPanel();renderProj();renderPrev();setDev("390");
$("bLogin").onclick=()=>authAction("login");
$("bSignup").onclick=()=>authAction("signup");
$("bSignOut").onclick=async()=>{if(supabaseClient)await supabaseClient.auth.signOut();};
$("authPassword").addEventListener("keydown",e=>{if(e.key==="Enter")authAction("login");});
initCloudAuth();
